# DXCA global configuration — copy to config/dxca.toml and edit.
# Every key is optional; absent keys use the defaults shown here, which
# reproduce the canonical shack wiring (1.x docs/UDP-PIPELINE.md): three
# decoder sources and a passthrough to RUMlog. Per-user settings (ClubLog
# credentials, alerts, Telegram) are NOT configured here — they live in
# the web GUI per account (SQLite, from M4).

# Web GUI + API. 0.0.0.0 = every interface (LAN service assumption —
# see docs/PLAN.md §5 on exposure).
web_bind = "0.0.0.0:7580"

# Telnet cluster server for loggers (Logger32, N1MM+, RUMlog, ...).
telnet_port = 7575

# Offer `LOGIN <callsign>` on the telnet port, so an operator can
# authenticate against their DXCA account (docs/TELNET-INTERACTIVE.md).
# Loggers are unaffected either way: a session that never sends LOGIN keeps
# the plain spot feed and its input is ignored, exactly as before.
#
# Once logged in, an operator can pass READ-ONLY cluster commands (SH/DX,
# SH/WWV, ...) to one node at a time, chosen with SET/NODE. Spotting, node
# filters and anything touching the node account are refused.
#
# Off by default on purpose: the port is unauthenticated, and every cluster
# node session logs in with `login_call` below, so this stays opt-in rather
# than arriving switched on in an upgrade.
#
# Telnet is plaintext: the password crosses the LAN in the clear. Fine for a
# shack LAN, not for anything reachable from outside it.
telnet_interactive = false

# Rebroadcast dedupe: first spot per CALL-BAND-MODE per window reaches the
# telnet feed and filtered UDP destinations.
dedupe_window_secs = 60

# In-memory spot ring served to the web UI.
spot_ring_capacity = 5000

# How often to re-download ClubLog's cty.xml (the DXCC prefix database), in
# days; 0 = manual only. The API key it needs is NOT here — this file is
# installed world-readable (0644) while data/dxca.db is 0600. A released dxca
# has a key baked into the binary, so nothing need be configured at all; an
# admin who would rather use their own sets it in the web UI (Settings >
# Reference data > Advanced), which stores it in the database.
cty_refresh_days = 7

# How often to re-download the LoTW users list, in days; 0 = manual only.
# Server-wide, because the list is one shared ~6 MB file rather than
# per-account. Each user's own ClubLog log has its own interval, set per
# account in the web UI (My ClubLog → Auto-refresh).
lotw_refresh_days = 7

# How often to re-download the IOTA directory (groups.json from
# iota-world.org, ~290 KB), in days; 0 = manual only. Validates the island
# references cluster spots announce, for the IOTA award levels.
iota_refresh_days = 30

# How often to re-download the FCC amateur database (~200 MB, distilled to
# an ~8 MB call→state table), in days; 0 = manual only. Powers the WAS
# (state) award levels. Whatever this says, the schedule only runs AFTER an
# admin has downloaded the table once by hand (Server → Reference data) —
# a download that size must never be a config default's surprise.
fcc_refresh_days = 30

# WSJT-X/JTDX/MSHV source listeners — point each decoder's UDP server at
# its own port here (DXCA is the sole listener on every port).
[[udp_sources]]
name = "MSHV"
port = 2333

[[udp_sources]]
name = "JTDX"
port = 2334

[[udp_sources]]
name = "WSJTX"
port = 2335

# UDP broadcast destinations. format: "cluster" (DX-Spider text line),
# "wsjtx" (synthesized Status+Decode pair per spot), or "passthrough"
# (every inbound source datagram relayed verbatim — keeps RUMlog
# click-to-fill working). sources = [] means all sources; unfiltered = true
# bypasses the dedupe/filter verdict (for RBN-style upstream aggregators).
[[broadcast_destinations]]
name = "RUMlog"
ip = "127.0.0.1"
port = 2237
format = "passthrough"

# DX-cluster telnet nodes to ingest (M3). Spots from nodes join the same
# pipeline as decoder spots; per-node status (three-state honest badge) is
# in /api/status. password is optional (rarely needed).
#[[cluster_nodes]]
#name = "VE7CC"
#host = "ve7cc.net"
#port = 23
#login_call = "VU2CPL-2"

# Directory for runtime state: dxca.db (users, sessions, per-user
# matrices) and the cached cty.xml. Relative to the working directory.
#data_dir = "data"
